name: Checar chaves Alpaca (paper)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["alpaca.py", "checar_chaves.py", ".github/workflows/checar-chaves.yml"]

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar conexão (mostra só status e patrimônio)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python checar_chaves.py
