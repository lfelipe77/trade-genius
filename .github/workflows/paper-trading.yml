name: Paper trading (Alpaca PAPER)

on:
  schedule:
    - cron: "7 * * * *"    # de hora em hora (minuto 7, UTC)
  workflow_dispatch:

permissions:
  contents: write   # para salvar logs/, relatorios/ e estado.json no repositório

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Robô de Execução (toda ordem passa pelo Robô de Risco)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python execucao.py
      - name: Relatório do dia
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python relatorio.py
      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "trade-genius-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in logs relatorios estado.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Paper trading: rodada $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
